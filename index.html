<script>
/* Home helper: reads the user agent, fills the device card and wires the "different version" panel.
   Nothing here touches the host scripts. Same ranges index.html uses to pick an exploit. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var m = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
  var v = m ? parseFloat(m[1]) : 0;
  var ok = m && (v === 5.05 || v === 5.07 ||
    (v >= 7.00 && v <= 8.52) || (v >= 9.00 && v <= 9.60) ||
    (v >= 10.00 && v <= 11.02) || (v >= 11.50 && v <= 12.02) ||
    (v >= 12.50 && v <= 13.00) || (v >= 13.02 && v <= 13.52) || v === 14.00);
  var ver = $("dcVer"), pill = $("dcPill"), btn = $("startBtn"), hint = $("dcHint");
  var CHECK = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5.5 12.8l4.4 4.4 8.6-9.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>', CROSS = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
  var hintText = hint.innerHTML;
  if (!m) {
    ver.innerHTML = "\u2014"; pill.className = "dc-pill is-bad";
    pill.innerHTML = CROSS + "\u0644\u064a\u0633 \u062c\u0647\u0627\u0632 PS4";
    hintText = "\u0627\u0641\u062a\u062d \u0627\u0644\u0635\u0641\u062d\u0629 \u0645\u0646 \u0645\u062a\u0635\u0641\u062d \u0627\u0644\u0628\u0644\u0627\u064a\u0633\u062a\u064a\u0634\u0646";
  } else if (ok) {
    ver.innerHTML = m[1]; pill.innerHTML = CHECK + "\u0645\u062f\u0639\u0648\u0645";
  } else {
    ver.innerHTML = m[1]; pill.className = "dc-pill is-bad"; pill.innerHTML = CROSS + "\u063a\u064a\u0631 \u0645\u062f\u0639\u0648\u0645";
    btn.className = "big-btn is-disabled"; btn.removeAttribute("href");
    hintText = "\u0627\u0644\u0641\u064a\u0631\u0645\u0648\u064a\u0631 \u062f\u0647 \u0645\u0634 \u0645\u062f\u0639\u0648\u0645 \u2014 \u062c\u0631\u0651\u0628 \u0625\u0635\u062f\u0627\u0631 \u0645\u062e\u062a\u0644\u0641";
  }
  hint.innerHTML = hintText;

  var alt = $("altLink"), back = $("backLink"), restore = $("restoreLink");
  var RESTORE_TEXT = "\u0627\u0633\u062a\u0639\u0627\u062f\u0629 \u0627\u0644\u0647\u0648\u0633\u062a \u0644\u062f\u0644\u064a\u0644 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0645\u0646 \u063a\u064a\u0631 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 DNS";
  function focusIt(el) { try { el.focus(); } catch (e) {} }
  alt.onclick = function () { document.body.className = "home alt-open"; focusIt(document.getElementsByClassName("card")[0]); return false; };
  back.onclick = function () { document.body.className = "home"; focusIt(m && !ok ? alt : btn); return false; };
  restore.onmouseover = restore.onfocus = function () { hint.innerHTML = RESTORE_TEXT; };
  restore.onmouseout = restore.onblur = function () { hint.innerHTML = hintText; };
  focusIt(btn.getAttribute("href") ? btn : alt);
})();
</script>

<div id="fwbadge" class="fw-badge" aria-live="polite"></div>
<script>
/* Firmware badge. Reads the user agent only and writes only into #fwbadge.
   The ranges below are the same ones index.html uses to pick an exploit:
   5.05 / 5.07, 7.00-8.52, 9.00-9.60, 10.00-11.02, 11.50-12.02,
   12.50-13.00, 13.02-13.52 and 14.00. */
(function () {
  var el = document.getElementById("fwbadge");
  if (!el) return;
  var m = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
  var ver = m ? m[1] : "", v = m ? parseFloat(m[1]) : 0;
  var ok = m && (v === 5.05 || v === 5.07 ||
    (v >= 7.00 && v <= 8.52) || (v >= 9.00 && v <= 9.60) ||
    (v >= 10.00 && v <= 11.02) || (v >= 11.50 && v <= 12.02) ||
    (v >= 12.50 && v <= 13.00) || (v >= 13.02 && v <= 13.52) || v === 14.00);
  var icon = ok
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M6.5 12.6l3.8 3.8 7.2-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>';
  el.className = "fw-badge " + (ok ? "is-ok" : "is-bad");
  if (!m) {
    el.innerHTML = icon + '<span class="fw-txt">\u0644\u064a\u0633 \u062c\u0647\u0627\u0632 PS4</span>';
  } else {
    el.innerHTML = icon + '<span class="fw-txt fw-ps">PS4</span><span class="fw-ver">' + ver + '</span><span class="fw-sep">\u00b7</span><span>' +
      (ok ? "\u0645\u062f\u0639\u0648\u0645" : "\u063a\u064a\u0631 \u0645\u062f\u0639\u0648\u0645") + '</span>';
  }
})();
</script>
