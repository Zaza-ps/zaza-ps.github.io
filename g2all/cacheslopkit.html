history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>

<script>
/* Visual helper only: it READS #msgs and never writes to it, so the cache scripts above are untouched.
   Fills the bar with the real percentage, drives the 3 steps and tints the status box. */
(function () {
  var msgs = document.getElementById("msgs");
  if (!msgs) return;
  var bar = document.getElementById("dlbar"), steps = document.getElementById("steps");
  var s1 = document.getElementById("step1"), dot = s1.getElementsByTagName("span")[0], small = s1.getElementsByTagName("small")[0];
  var title = document.getElementById("pvTitle"), note = document.getElementById("pvNote");
  var CHECK = '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M5.5 12.8l4.4 4.4 8.6-9.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>', CROSS = '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
  var state = "";
  function paint() {
    var t = msgs.textContent || "", m = t.match(/(\d+)\s*%/);
    if (/Error|Failed|Not Found|Unsupported/i.test(t)) state = "fail";
    else if (state !== "fail" && /Installed Successfully|Now Close/i.test(t)) state = "ok";
    if (state === "ok") {
      bar.style.width = "100%"; bar.className = "is-ok";
      s1.className = "step is-done"; dot.innerHTML = CHECK; small.innerHTML = "\u062a\u0645\u0651\u062a";
      steps.className = "steps p1";
      title.innerHTML = "\u062a\u0645 \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0643\u0627\u0634";
      note.innerHTML = "\u0627\u0642\u0641\u0644 \u0627\u0644\u0645\u062a\u0635\u0641\u062d \u0648\u0627\u0641\u062a\u062d\u0647 \u062a\u0627\u0646\u064a \u0639\u0634\u0627\u0646 \u064a\u0643\u0645\u0644";
    } else if (state === "fail") {
      bar.className = "is-fail";
      s1.className = "step is-fail"; dot.innerHTML = CROSS; small.innerHTML = "\u0641\u0634\u0644";
      title.innerHTML = "\u0641\u0634\u0644 \u0627\u0644\u062a\u062d\u0645\u064a\u0644";
      note.innerHTML = "\u0627\u0645\u0633\u062d \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0645\u062a\u0635\u0641\u062d \u0648\u062c\u0631\u0628 \u062a\u0627\u0646\u064a";
    } else if (m) {
      bar.style.width = m[1] + "%";
      small.innerHTML = "\u062c\u0627\u0631\u064a \u0627\u0644\u062a\u062d\u0645\u064a\u0644 " + m[1] + "%";
    }
    msgs.className = "loader-status" + (state ? " is-" + state : "");
  }
  paint();
  setInterval(paint, 250);
})();
</script>

<div id="fwbadge" class="fw-badge" aria-live="polite"></div>
<script>
/* Firmware badge. Reads the user agent only and writes only into #fwbadge.
   The ranges below are the same ones index.html uses to pick an exploit:
   5.05 / 5.07, 7.00-8.52, 9.00-9.60, 10.00-11.02, 11.50-12.02,
   12.50-13.00, 13.02-13.52 and 14.00. */
(function () {
  var el = document.getElementById("fwbadge");
  if (!el) return;
  var m = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
  var ver = m ? m[1] : "", v = m ? parseFloat(m[1]) : 0;
  var ok = m && (v === 5.05 || v === 5.07 ||
    (v >= 7.00 && v <= 8.52) || (v >= 9.00 && v <= 9.60) ||
    (v >= 10.00 && v <= 11.02) || (v >= 11.50 && v <= 12.02) ||
    (v >= 12.50 && v <= 13.00) || (v >= 13.02 && v <= 13.52) || v === 14.00);
  var icon = ok
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M6.5 12.6l3.8 3.8 7.2-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>';
  el.className = "fw-badge " + (ok ? "is-ok" : "is-bad");
  if (!m) {
    el.innerHTML = icon + '<span class="fw-txt">\u0644\u064a\u0633 \u062c\u0647\u0627\u0632 PS4</span>';
  } else {
    el.innerHTML = icon + '<span class="fw-txt fw-ps">PS4</span><span class="fw-ver">' + ver + '</span><span class="fw-sep">\u00b7</span><span>' +
      (ok ? "\u0645\u062f\u0639\u0648\u0645" : "\u063a\u064a\u0631 \u0645\u062f\u0639\u0648\u0645") + '</span>';
  }
})();
</script>
